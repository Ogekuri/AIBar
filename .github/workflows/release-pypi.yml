name: Release (PyPI+extension)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # canonical version tag (e.g. v1.2.3) without pre-release suffix

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # 1. Resolve whether the tagged commit belongs to master or develop
  check-branch:
    runs-on: ubuntu-latest
    outputs:
      is_master: ${{ steps.check.outputs.is_master }}
      is_release_branch: ${{ steps.check.outputs.is_release_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tagged release branch
        id: check
        run: |
          git fetch origin master
          git fetch origin develop || echo "origin/develop not found on remote"
          if git branch -r --contains "${GITHUB_SHA}" | grep -q "origin/master"; then
            echo "Tag ${{ github.ref }} is on master branch: release asset publication and PyPI publication enabled."
            echo "is_master=true" >> "$GITHUB_OUTPUT"
            echo "is_release_branch=true" >> "$GITHUB_OUTPUT"
          elif git branch -r --contains "${GITHUB_SHA}" | grep -q "origin/develop"; then
            echo "Tag ${{ github.ref }} is on develop branch: release asset publication enabled, PyPI publication skipped."
            echo "is_master=false" >> "$GITHUB_OUTPUT"
            echo "is_release_branch=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${{ github.ref }} is not on master or develop branch: skipping release."
            echo "is_master=false" >> "$GITHUB_OUTPUT"
            echo "is_release_branch=false" >> "$GITHUB_OUTPUT"
          fi

  # 2. Publish the release artifacts already committed under dist/ by the local build pipeline.
  # No build runs here: the tagged commit is the single source of every artifact.
  release-assets:
    needs: check-branch
    # Runs for version tags on either the master or the develop branch
    if: needs.check-branch.outputs.is_release_branch == 'true'
    outputs:
      is_master: ${{ needs.check-branch.outputs.is_master }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify pre-built dist artifacts
        run: |
          set -euo pipefail
          missing=0
          for pattern in 'dist/*.tar.gz' 'dist/*.whl' 'dist/aibar@aibar.panel.shell-extension.zip'; do
            if ! compgen -G "$pattern" > /dev/null; then
              echo "ERROR: missing pre-built release artifact in the tagged commit: $pattern" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "ERROR: the tagged commit must contain the sdist, wheel, and GNOME extension zip in dist/." >&2
            exit 1
          fi
          ls -l dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "COMMIT"
          configurationJson: |
            {
              "categories": [
               { "title": "## ⛰️ Features", "labels": ["new"] },
               { "title": "## 🏗️ Implementations", "labels": ["implement"] },
               { "title": "## 🐛 Bug Fixes", "labels": ["fix"] },
               { "title": "## 🚜 Changes", "labels": ["change"] },
               { "title": "## 🎯 Cover Requirements", "labels": ["cover"] },
               { "title": "## ✨ Refactor", "labels": ["refactor"] },
               { "title": "## 📚 Documentation", "labels": ["docs"] },
               { "title": "## 🎨 Styling", "labels": ["style"] },
               { "title": "## ◀️ Revert", "labels": ["revert"] },
               { "title": "## ⚙️ Miscellaneous Tasks", "labels": ["misc"] },
               { "title": "## 💬 Other", "labels": ["other"] },
               { "title": "## ❓ Unknown", "labels": ["unknown"] },
               { "title": "## 🚀 Release", "labels": ["release"] }
             ],
             "ignore_labels": [
                "release",
                "ignore"
             ],
             "transformers": [
              {
                "pattern": "^[^\\(:\\s]+(\\([^\\)]+\\))?!?:\\s+([\\S]+[\\s\\S]*)",
                "target": "$2 $1"
              }
             ],
             "sort": {
                "order": "ASC",
                "on_property": "mergedAt"
             },
             "template": "#{{CHANGELOG}}\n\n<details>\n<summary>Uncategorized</summary>\n\n#{{UNCATEGORIZED}}\n</details>\n\n**Full Changelog**: [#{{FROM_TAG}}...#{{TO_TAG}}](https://github.com/#{{OWNER}}/#{{REPO}}/compare/#{{FROM_TAG}}...#{{TO_TAG}})",
              "label_extractor": [
               {
                 "pattern": "^([^\\(:\\s]+)(\\([^\\)]+\\))?(!)?:\\s+([\\S]+[\\s\\S]*)",
                 "on_property": "title",
                 "target": "$1"
               }
             ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          files: dist/**/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          tag_name: ${{ github.ref_name }}
          name: ${{github.event.repository.name}} ${{ github.ref_name }}
          body: ${{ steps.build_changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error

  # 3. Publish the tagged-commit distributions to PyPI via Trusted Publishing (OIDC)
  publish-pypi:
    needs: release-assets
    # Publishes to PyPI only for version tags on the master branch
    if: needs.release-assets.outputs.is_master == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Publish Python distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
