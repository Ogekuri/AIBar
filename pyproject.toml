[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aibar"
version = "0.60.0"
description = "CLI usage monitor for Antigravity, OpenAI, OpenRouter, GitHub Copilot, Codex, and GeminiAI."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">= 3.12"
dependencies = [
    "click",
    "google-api-python-client",
    "google-cloud-bigquery",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "httpx",
    "pydantic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Ogekuri/AiBar"
Repository = "https://github.com/Ogekuri/AiBar"
Issues = "https://github.com/Ogekuri/AiBar/issues"
Changelog = "https://github.com/Ogekuri/AiBar/releases"

[dependency-groups]
dev = ["pytest"]

[project.scripts]
aibar = "aibar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aibar/aibar"]

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.sdist]
include = [
    "src/aibar/aibar/**",
    "hatch_build.py",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    "LICENSE_GnomeCodexBar",
]

[tool.pytest.ini_options]
pythonpath = ["src/aibar"]
